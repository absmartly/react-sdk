name: Publish

# Publishes @absmartly/react-sdk to npm using npm Trusted Publishing (OIDC).
#
# - Push a tag "v<version>" matching package.json to publish.
# - Run manually (workflow_dispatch) with dry_run=true (the default) to run every
#   step except the actual `npm publish`. A non-dry manual run must be started
#   on a v* tag ref.
#
# The trusted publisher on npmjs.com is configured for this repository, the
# workflow filename "publish.yml" and the environment "npm"; renaming this file
# or the environment breaks publishing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every step except npm publish"
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # No dependency cache: this job can mint an OIDC publish token.

      # Trusted Publishing requires npm >= 11.5.1.
      - name: Update npm
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@latest
          NPM_VERSION=$(npm --version)
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`::error::npm ${process.argv[1]} is older than 11.5.1, required for Trusted Publishing`);
              process.exit(1);
            }
          ' "$NPM_VERSION"
          echo "npm $NPM_VERSION"

      # The repository is locked with yarn.lock (there is no package-lock.json),
      # so `npm ci` cannot be used; this is the yarn equivalent. Dependency
      # install scripts are skipped because this job can mint an OIDC token.
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Run tests
        run: yarn test --run

      - name: Build
        run: yarn build

      - name: Check tag and resolve npm dist-tag
        id: release
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REQUIRE_TAG: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          REPOSITORY=$(node -p "JSON.stringify(require('./package.json').repository ?? null)")
          LATEST_VERSION=$(npm view @absmartly/react-sdk dist-tags.latest)
          if [ -z "$LATEST_VERSION" ]; then
            echo "::error::Could not read the current latest version from npm" >&2
            exit 1
          fi
          # As in javascript-sdk: an already published version (e.g. a re-run)
          # is a green no-op rather than a failing publish.
          ALREADY_PUBLISHED=false
          if npm view @absmartly/react-sdk versions --json | jq -e --arg v "$VERSION" 'index($v) != null' >/dev/null; then
            ALREADY_PUBLISHED=true
            echo "::notice::@absmartly/react-sdk@${VERSION} is already on npm; publish will be skipped"
          fi
          export VERSION REPOSITORY LATEST_VERSION
          DIST_TAG=$(node .github/scripts/publish-checks.mjs)
          echo "Publishing ${VERSION} (npm latest: ${LATEST_VERSION}, dist-tag: ${DIST_TAG:-latest})"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
          echo "already_published=${ALREADY_PUBLISHED}" >> "$GITHUB_OUTPUT"

      - name: Preview package contents
        run: npm pack --dry-run --ignore-scripts

      # --ignore-scripts: the build above is the tested artifact; the prepack
      # script would otherwise run `yarn upgrade` and rebuild with other deps.
      - name: Publish to npm
        if: >-
          steps.release.outputs.already_published != 'true' &&
          (github.event_name == 'push' || inputs.dry_run == false)
        shell: bash
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          # Fallback only: npm authenticates with the OIDC trusted publisher
          # first and uses this token only if OIDC is unavailable. Remove the
          # NPM_TOKEN secret once Trusted Publishing is confirmed working.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=(--provenance --access public --ignore-scripts)
          if [ -n "$DIST_TAG" ]; then
            ARGS+=(--tag "$DIST_TAG")
          fi
          npm publish "${ARGS[@]}"
